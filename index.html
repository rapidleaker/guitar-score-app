<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Chords</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="homeScreen" class="home-screen">
    <header class="home-header">
      <h1>My Chords</h1>
      <button id="newSongBtn" class="primary-button">＋ 新しいコード譜を作成</button>
    </header>

    <main class="home-main">
      <div class="home-title-row">
        <h2>保存したコード譜</h2>
        <span id="songCount"></span>
      </div>
      <div id="songList" class="song-list"></div>
      <p id="emptyMessage" class="empty-message hidden">
        保存したコード譜はありません。
      </p>
    </main>
  </section>

  <section id="editorScreen" class="editor-screen hidden">
    <header class="app-header">
      <div class="editor-title-row">
        <button id="homeBtn">← 一覧へ戻る</button>
        <h1>My Chords</h1>
      </div>

      <div class="song-meta">
        <label>
          曲名
          <input id="titleInput" type="text" placeholder="曲名">
        </label>
        <label>
          アーティスト
          <input id="artistInput" type="text" placeholder="アーティスト名">
        </label>
        <label>
          Key
          <input id="keyInput" type="text" placeholder="例: C">
        </label>
        <label>
          Capo
          <input id="capoInput" type="number" min="0" max="12" value="0">
        </label>
      </div>

      <div class="font-size-settings">
        <label>
          歌詞サイズ
          <div class="font-size-control">
            <input
              id="lyricFontSizeInput"
              type="range"
              min="12"
              max="32"
              step="1"
            >
            <output id="lyricFontSizeValue">16</output>px
          </div>
        </label>

        <label>
          コードサイズ
          <div class="font-size-control">
            <input
              id="chordFontSizeInput"
              type="range"
              min="12"
              max="32"
              step="1"
            >
            <output id="chordFontSizeValue">16</output>px
          </div>
        </label>

        <button id="resetFontSizeBtn" type="button">
          サイズを標準に戻す
        </button>
      </div>

      <div class="toolbar">
        <button id="lyricsMode" class="mode active">歌詞編集</button>
        <button id="chordsMode" class="mode">コード編集</button>
        <button id="previewMode" class="mode">プレビュー</button>
        <span class="spacer"></span>
        <button id="undoBtn" title="戻す">↶ 戻す</button>
        <button id="redoBtn" title="やり直す">↷ やり直す</button>
        <button id="printBtn">印刷</button>
      </div>

      <div id="status" aria-live="polite"></div>
    </header>

    <main>
      <section id="lyricsEditor" class="panel">
        <label for="lyricsInput" class="section-label">
          歌詞（改行・空行を保持します）
        </label>
        <textarea
          id="lyricsInput"
          spellcheck="false"
          placeholder="歌詞を入力または貼り付けてください"
        ></textarea>
      </section>

      <section id="chordsEditor" class="panel hidden">
        <p class="hint">
          歌詞をタップ／クリックすると、その文字位置にコードを追加できます。
          コードを選択してドラッグ、矢印キー、操作ボタンで調整できます。
        </p>

        <div id="scoreEditor" class="score"></div>

        <div id="mobileControls" class="mobile-controls hidden">
          <button id="deleteChordBtn">削除</button>
          <button id="nudgeLeftBtn">←</button>
          <input id="selectedChordName" aria-label="選択中のコード名">
          <button id="nudgeRightBtn">→</button>
        </div>
      </section>

      <section id="preview" class="panel hidden">
        <article id="previewSheet" class="sheet"></article>
      </section>
    </main>
  </section>

  <script src="app.js"></script>
</body>
</html>
